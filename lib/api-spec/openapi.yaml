openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Meeting Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project operations
  - name: meetings
    description: Meeting operations
  - name: materials
    description: Meeting material operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List meetings in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Meeting"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create a new meeting in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingInput"
      responses:
        "201":
          description: Created meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Project deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project's name or description
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings/{meetingId}:
    delete:
      operationId: deleteMeeting
      tags: [meetings]
      summary: Delete a meeting by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Meeting deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get a meeting by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update a meeting's title, date, or notes
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingUpdateInput"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings/{meetingId}/materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List materials for a meeting
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
        "404":
          description: Project or meeting not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMaterial
      tags: [materials]
      summary: Upload a file or text material to a meeting
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MaterialFileInput"
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialTextInput"
      responses:
        "201":
          description: Created material (may still be processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or meeting not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings/{meetingId}/materials/{materialId}:
    patch:
      operationId: updateMaterialSpeakers
      tags: [materials]
      summary: Assign real names to diarized speakers in an audio transcript
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
        - name: materialId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerMapInput"
      responses:
        "200":
          description: Updated material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMaterial
      tags: [materials]
      summary: Delete a material by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
        - name: materialId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Material deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings/{meetingId}/materials/{materialId}/retry:
    post:
      operationId: retryMaterial
      tags: [materials]
      summary: Retry text extraction for a failed material
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
        - name: materialId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Material reset to processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings/{meetingId}/tasks:
    get:
      operationId: listMeetingTasks
      tags: [tasks]
      summary: List tasks for a meeting
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMeetingTask
      tags: [tasks]
      summary: Create a task on a meeting
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings/{meetingId}/tasks/{taskId}:
    patch:
      operationId: updateMeetingTask
      tags: [tasks]
      summary: Update a task's description, assignee, or completed state
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
        - name: taskId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMeetingTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
        - name: taskId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Task deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/meetings/{meetingId}/tasks/extract:
    post:
      operationId: extractMeetingTasks
      tags: [tasks]
      summary: Use AI to suggest and create tasks from this meeting's notes and materials
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
        - name: meetingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Newly created tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTasksResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Extraction failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks across all projects, with optional filters
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: number
        - name: meetingId
          in: query
          required: false
          schema:
            type: number
        - name: assignee
          in: query
          required: false
          schema:
            type: string
        - name: completed
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of tasks with meeting/project context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskWithContext"

  /projects/{projectId}/timeline:
    get:
      operationId: getProjectTimeline
      tags: [projects]
      summary: Chronological meeting highlights for a project, with AI-generated change detection between meetings
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTimeline"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Timeline generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/summary:
    get:
      operationId: getProjectSummary
      tags: [projects]
      summary: Get a project summary with meeting count and latest meeting date
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Search projects (name/description), meetings (title), and materials (extracted text/context note)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: Missing query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [projects]
      summary: Get overall stats (total projects, total meetings, recent meetings)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Project:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    Meeting:
      type: object
      required: [id, projectId, title, date, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        date:
          type: string
          format: date
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MeetingInput:
      type: object
      required: [title, date]
      properties:
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        notes:
          type: string

    MeetingUpdateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        date:
          type: string
          format: date
        notes:
          type: ["string", "null"]

    ProjectUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    ProjectSummary:
      type: object
      required: [id, name, meetingCount, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        meetingCount:
          type: number
        latestMeetingDate:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RecentMeeting:
      type: object
      required: [id, projectId, title, date, projectName]
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        date:
          type: string
          format: date
        projectName:
          type: string

    Stats:
      type: object
      required: [totalProjects, totalMeetings, recentMeetings]
      properties:
        totalProjects:
          type: number
        totalMeetings:
          type: number
        recentMeetings:
          type: array
          items:
            $ref: "#/components/schemas/RecentMeeting"

    SearchProjectResult:
      type: object
      required: [id, name]
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]

    SearchMeetingResult:
      type: object
      required: [id, projectId, projectName, title, date]
      properties:
        id:
          type: number
        projectId:
          type: number
        projectName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        snippet:
          type: ["string", "null"]

    SearchResult:
      type: object
      required: [projects, meetings]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/SearchProjectResult"
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/SearchMeetingResult"

    TimelineEntry:
      type: object
      required: [meetingId, title, date, highlight]
      properties:
        meetingId:
          type: number
        title:
          type: string
        date:
          type: string
          format: date
        highlight:
          type: string
        changeFromPrevious:
          type: ["string", "null"]

    ProjectTimeline:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"

    MaterialType:
      type: string
      enum: [photo, image, pdf, excel, pptx, text, audio]

    MaterialStatus:
      type: string
      enum: [processing, ready, error]

    Material:
      type: object
      required: [id, meetingId, type, filename, originalName, status, createdAt]
      properties:
        id:
          type: number
        meetingId:
          type: number
        type:
          $ref: "#/components/schemas/MaterialType"
        filename:
          type: string
        originalName:
          type: string
        extractedText:
          type: ["string", "null"]
        contextNote:
          type: ["string", "null"]
        speakerMap:
          type: ["object", "null"]
          additionalProperties:
            type: string
        status:
          $ref: "#/components/schemas/MaterialStatus"
        createdAt:
          type: string
          format: date-time

    SpeakerMapInput:
      type: object
      required: [speakerMap]
      properties:
        speakerMap:
          type: object
          additionalProperties:
            type: string

    MaterialFileInput:
      type: object
      required: [type, file]
      properties:
        type:
          $ref: "#/components/schemas/MaterialType"
        file:
          type: string
          format: binary

    MaterialTextInput:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [text]
        name:
          type: string
        content:
          type: string
        contextNote:
          type: string

    Task:
      type: object
      required: [id, meetingId, description, completed, createdAt]
      properties:
        id:
          type: number
        meetingId:
          type: number
        description:
          type: string
        assignee:
          type: ["string", "null"]
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
        assignee:
          type: string

    TaskUpdateInput:
      type: object
      properties:
        description:
          type: string
          minLength: 1
        assignee:
          type: ["string", "null"]
        completed:
          type: boolean

    TaskWithContext:
      type: object
      required: [id, meetingId, meetingTitle, meetingDate, projectId, projectName, description, completed, createdAt]
      properties:
        id:
          type: number
        meetingId:
          type: number
        meetingTitle:
          type: string
        meetingDate:
          type: string
          format: date
        projectId:
          type: number
        projectName:
          type: string
        description:
          type: string
        assignee:
          type: ["string", "null"]
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ExtractTasksResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
